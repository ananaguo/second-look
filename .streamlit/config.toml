# .streamlit/config.toml
# Streamlit settings for Second Look.
# This file holds no keys or passwords, so it is safe to share on GitHub.
# These colors match styles.py, so Streamlit's own parts (radio dots,
# checkboxes, links) use the same navy instead of a different blue.

[theme]
base = "light"
primaryColor = "#14213D"             # navy, used for primary buttons and chosen dots
backgroundColor = "#FAF9F6"          # the warm off-white page
secondaryBackgroundColor = "#FFFFFF" # white inside boxes you type in
textColor = "#1B1F24"                # body text
font = "serif"                       # styles.py sets Times New Roman on top of this

[client]
toolbarMode = "minimal"              # fewer Streamlit controls on screen
showSidebarNavigation = false        # never show a sidebar menu

[browser]
gatherUsageStats = false             # don't send usage stats to Streamlit